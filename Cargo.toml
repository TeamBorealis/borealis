[workspace]
resolver = "2"
members = [
  "crates/borealis-content",
  "crates/borealis-engine",
  "crates/borealis-character",
  "crates/borealis-migrate",
  "crates/borealis-sheet",
  "crates/borealis-ai",
  "crates/borealis-assist",
  "crates/borealis-import-5etools",
  "crates/borealis-mcp",
  "crates/borealis-android-assets",
  "src-tauri",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/alon-mini/borealis"
homepage = "https://borealisbuilder.com"
publish = false
rust-version = "1.80"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "fmt", "env-filter"] }
tracing-appender = "0.2"
quick-xml = "0.42"
tokio = { version = "1", features = ["process", "io-util", "rt", "macros", "sync"] }
borealis-content = { path = "crates/borealis-content" }
borealis-engine = { path = "crates/borealis-engine" }
borealis-character = { path = "crates/borealis-character" }
borealis-migrate = { path = "crates/borealis-migrate" }
borealis-sheet = { path = "crates/borealis-sheet" }
borealis-ai = { path = "crates/borealis-ai" }
borealis-assist = { path = "crates/borealis-assist" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
