[package]
name = "borealis-embed"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "Optional local embeddings (EmbeddingGemma 2): embedder trait, device tiers, indexing scheduler, vector store, RRF fusion"

[lints]
workspace = true

[features]
# The llama.cpp backend (spec sec. 7, option (b)): the Borealis fork of llama-cpp-rs, CPU backend only. Off by
# default so workspace tests and crates that only need the trait, store or fake build no C++; the app enables it.
llama = ["dep:llama-cpp-2"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
sha2 = "0.10"
# Model download (S3.2). Blocking client only: the app adds its platform TLS (rustls) through feature
# unification and hands in the ClientBuilder (content_fetch_tls), so this crate picks no TLS stack itself.
reqwest = { version = "0.13", default-features = false, features = ["blocking"] }
# llama.cpp binding (B-46 fork, branch `borealis`): upstream PR #1175 (llama.cpp v0.7.0 620d222, EmbeddingGemma 2)
# plus no forced Metal on macOS and GGML_METAL=OFF on Apple unless feature `metal`; sys default features off
# (no `common` library). Pinned by commit; switch to a crates.io release once one carries PR #1175.
llama-cpp-2 = { git = "https://github.com/alon-mini/llama-cpp-rs", rev = "3364c402b23652b31c450f6c7ae63607ef10a4d1", default-features = false, optional = true }

# Desktop RAM probe (spec sec. 7 tier table). Only the memory part ("system"), no disks/network/components.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
sysinfo = { version = "0.36", default-features = false, features = ["system"] }

# Android: libc++ linked statically into the app library, so no libc++_shared.so has to ship in the APK.
[target.'cfg(target_os = "android")'.dependencies]
llama-cpp-2 = { git = "https://github.com/alon-mini/llama-cpp-rs", rev = "3364c402b23652b31c450f6c7ae63607ef10a4d1", default-features = false, features = ["android-static-stdcxx"], optional = true }

# iOS shims: ProcessInfo (RAM, Low Power Mode, thermal state) and UIDevice (battery), through the safe objc2
# bindings Tauri already links on iOS.
[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSProcessInfo"] }
objc2-ui-kit = { version = "0.3", default-features = false, features = ["std", "UIDevice"] }
dispatch2 = { version = "0.3", default-features = false, features = ["std"] }

[dev-dependencies]
tempfile = "3"
