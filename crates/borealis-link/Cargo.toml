[package]
name = "borealis-link"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "Device identity, pairing, certificate pinning, secure store and the authenticated device-to-device transport"

[lints]
workspace = true

[features]
# Everything on for this crate's own build and tests (`cargo test -p borealis-link`). Dependents
# use the workspace entry, which sets default-features = false, and opt in per feature.
default = ["tcp", "platform-store"]
# rustls (aws-lc-rs) pinned-certificate TLS: device identity, server/client configs, pin verifiers.
# No sockets; borealis-ai's LAN host and remote client build on it.
tls = ["dep:rustls", "dep:rcgen"]
# The tokio + rustls TCP implementation of `Transport`. Builds for desktop, iOS and Android; the app
# enables it only where a network stack is wanted (mobile links none without it).
tcp = ["tls", "dep:tokio", "dep:tokio-rustls"]
# Platform secure store: Keychain (macOS/iOS), Android Keystore, Windows Credential Manager,
# Linux Secret Service. Without it only `MemoryStore` exists.
platform-store = [
    "dep:keyring-core",
    "dep:apple-native-keyring-store",
    "dep:android-native-keyring-store",
    "dep:windows-native-keyring-store",
    "dep:zbus-secret-service-keyring-store",
]

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
sha2 = "0.10"
base64 = "0.23.1"
getrandom = "0.3"
tempfile = "3"
zeroize = "1"
rustls = { version = "0.23", optional = true, default-features = false, features = ["aws_lc_rs", "std"] }
rcgen = { version = "0.14", optional = true, default-features = false, features = ["aws_lc_rs"] }
tokio = { workspace = true, optional = true, features = ["net", "time", "io-util", "rt", "sync", "macros"] }
tokio-rustls = { version = "0.26", optional = true, default-features = false, features = ["aws_lc_rs"] }
keyring-core = { version = "1", optional = true }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
# macOS: the login keychain (works for unsigned dev builds); iOS: the data-protection keychain.
apple-native-keyring-store = { version = "1", optional = true, features = ["keychain", "protected"] }

[target.'cfg(target_os = "android")'.dependencies]
# SharedPreferences encrypted with an Android Keystore key; needs the ndk-context Tauri initialises.
android-native-keyring-store = { version = "1", optional = true }

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = { version = "1", optional = true }

[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "ios", target_os = "android"))))'.dependencies]
# Pure-Rust D-Bus (no libdbus), Rust crypto for the session (no OpenSSL).
zbus-secret-service-keyring-store = { version = "1", optional = true, features = ["rt-tokio-crypto-rust"] }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["net", "time", "io-util", "rt", "rt-multi-thread", "sync", "macros"] }
