[package]
name = "borealis"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "Borealis - cross-platform D&D character builder"

[lib]
name = "borealis_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Same as [workspace.lints], except unsafe_code is "deny" rather than "forbid" so the one Windows-only
# FFI module (src/console_attach.rs, AttachConsole/SetStdHandle) can opt out with #[allow(unsafe_code)].
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
borealis-content.workspace = true
borealis-engine.workspace = true
borealis-character.workspace = true
borealis-sheet.workspace = true
thiserror.workspace = true
base64 = "0.22"
miniz_oxide = "0.9.1"
uuid = { version = "1", features = ["v4"] }
tauri-plugin-dialog = "2"
sha2 = "0.10"
borealis-migrate.workspace = true
borealis-import-5etools = { path = "../crates/borealis-import-5etools" }
# Base borealis-ai stays on every target: borealis-assist, borealis-mcp and the import validators build on
# its deterministic pieces. Its CLI runner, LAN host and remote client are only reached from desktop-only modules.
borealis-ai.workspace = true
borealis-assist.workspace = true
borealis-mcp = { path = "../crates/borealis-mcp" }
tokio = { workspace = true, features = ["time"] }
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }
borealis-ai = { workspace = true, features = ["host"] }

# Phones only: opens the download page in the system browser (desktop spawns the OS opener itself).
# The .index downloader verifies TLS against the bundled Mozilla roots (webpki-roots), not the OS
# verifier, which needs JNI glue on Android (spike S0.3).
# B-W1: attach the GUI-subsystem Windows build to the parent console in CLI/MCP mode.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Console"] }

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-opener = "2"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "aws_lc_rs"] }
webpki-roots = "1"

[target.'cfg(target_os = "android")'.dependencies]
borealis-android-assets = { path = "../crates/borealis-android-assets" }
