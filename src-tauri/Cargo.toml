[package]
name = "borealis"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "Borealis - cross-platform D&D character builder"

[lib]
name = "borealis_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Same as [workspace.lints], except unsafe_code is "deny" rather than "forbid" so the one Windows-only
# FFI module (src/console_attach.rs, AttachConsole/SetStdHandle) can opt out with #[allow(unsafe_code)].
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }

[features]
default = ["device-link"]
# Device transfer (B2/B3): tokio + rustls TCP, SPAKE2/QR authentication and the OS secure store
# (Keychain, Android Keystore, Credential Manager, Secret Service). On by default since B3 on every
# target (X0.1: GO on iOS and Android); mDNS discovery is desktop-only (see below).
device-link = ["borealis-link/tcp", "borealis-link/platform-store", "dep:borealis-transfer"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
borealis-content.workspace = true
borealis-engine.workspace = true
borealis-character.workspace = true
borealis-sheet.workspace = true
thiserror.workspace = true
base64 = "0.22"
miniz_oxide = "0.9.1"
uuid = { version = "1", features = ["v4"] }
tauri-plugin-dialog = "2"
sha2 = "0.10"
borealis-migrate.workspace = true
borealis-import-5etools = { path = "../crates/borealis-import-5etools" }
# Base borealis-ai stays on every target: borealis-assist, borealis-mcp and the import validators build on
# its deterministic pieces. Its CLI runner, LAN host and remote client are only reached from desktop-only modules.
borealis-ai.workspace = true
borealis-assist.workspace = true
borealis-mcp = { path = "../crates/borealis-mcp" }
# Local keyword search (Tantivy, pure Rust on every target; S0.1).
borealis-search.workspace = true
# Semantic search runtime: tiers, scheduler, device-state shims (S3.1; no llama.cpp until B-46).
borealis-embed.workspace = true
tokio = { workspace = true, features = ["time", "rt", "sync", "macros"] }
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
# Device link (B1): registry paths and model on every target; the network stack and OS secure
# store only with the `device-link` feature.
borealis-link.workspace = true
borealis-bundle.workspace = true
borealis-transfer = { workspace = true, optional = true }
tempfile = "3"

[dev-dependencies]
tempfile = "3"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }
borealis-ai = { workspace = true, features = ["host"] }
# mDNS nameplate discovery for typed codes: desktop only (iOS needs the multicast entitlement,
# Android a MulticastLock; phones use the QR's host:port or a typed address instead).
borealis-link = { workspace = true, features = ["mdns"] }

# Phones only: opens the download page in the system browser (desktop spawns the OS opener itself).
# The .index downloader verifies TLS against the bundled Mozilla roots (webpki-roots), not the OS
# verifier, which needs JNI glue on Android (spike S0.3).
# B-W1: attach the GUI-subsystem Windows build to the parent console in CLI/MCP mode.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Console"] }

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-opener = "2"
# Phones: scans the other device's Send/Receive QR (B4). The web view may call only scan, cancel and the
# camera permission check/request (capabilities/mobile.json); desktop has no scanner (typed code instead).
tauri-plugin-barcode-scanner = "2.5.3"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "aws_lc_rs"] }
webpki-roots = "1"

[target.'cfg(target_os = "android")'.dependencies]
borealis-android-assets = { path = "../crates/borealis-android-assets" }
