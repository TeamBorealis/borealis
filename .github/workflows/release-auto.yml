name: Release automation

# The weekly release, run by itself (tools/release-schedule/auto.py): freeze Sunday 23:59, signed builds Monday
# 20:00, App Store submission, the signed Play bundle to closed testing (alpha, RL8) and release notes to Discord
# #mod-chat Tuesday 12:00, go/no-go Thursday 18:00, publish Thursday 20:00 (Israel time). Every run is one
# idempotent tick that does what is due.
#
# An external timer dispatches this workflow every 15 minutes, because GitHub's own schedule fires hours late; the
# cron below is only a backup. The plan job decides cheaply whether anything is due; the tick job does it, inside
# the `release` environment (App Store Connect key, Play service account, website deploy key) only when needed.
# The Play upload needs the `release` environment secret PLAY_SERVICE_ACCOUNT_JSON (the service account's JSON
# key); without it the Tuesday note says the bundle goes up by hand. It only ever touches the alpha track.
#
# Repository variables: RELEASE_AUTO must be "on" for live runs (otherwise every tick is a dry run); RELEASE_HOLD
# holds a version ("1.3.0", or "all"); RELEASE_GIT_NAME / RELEASE_GIT_EMAIL are the release commits' author.
# By hand: Actions > Release automation > Run workflow, with a step (freeze, submit, publish, ...) and dry run.
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only log what would be done; touch nothing"
        type: boolean
        default: false
      step:
        description: "auto = whatever is due now; any other step runs by hand, whatever the time"
        type: choice
        options: [auto, freeze, signed, submit, gonogo, publish, slip, ios-supersede, notes]
        default: auto
      version:
        description: "Only this release (default: the one due, or the next scheduled)"
        type: string
        default: ""
      now:
        description: "Pretend it is this time (ISO 8601 with a zone, e.g. 2026-11-08T23:59+02:00); dry run only"
        type: string
        default: ""
      scenario:
        description: "Replace the live state with tools/release-schedule/scenarios/<name>.json; dry run only"
        type: string
        default: ""
  # The same inputs, for calling this workflow from another one (dry-run checks).
  workflow_call:
    inputs:
      dry_run: {type: boolean, default: false}
      step: {type: string, default: auto}
      version: {type: string, default: ""}
      now: {type: string, default: ""}
      scenario: {type: string, default: ""}

permissions:
  contents: read

# Live ticks queue one at a time; dry runs never wait for them.
concurrency:
  group: release-auto${{ inputs.dry_run && format('-dry-{0}-{1}-{2}', github.run_id, inputs.scenario, inputs.now) || '' }}
  cancel-in-progress: false

jobs:
  plan:
    if: github.repository == 'TeamBorealis/borealis'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.plan.outputs.run }}
      env: ${{ steps.plan.outputs.env }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          sparse-checkout: |
            tools/release-schedule
            tools/discord-issues
          persist-credentials: false
      - name: Self-test
        run: python3 -I -m unittest discover -s tools/release-schedule
      - id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          STEP: ${{ inputs.step || 'auto' }}
          NOW: ${{ inputs.now }}
          SCENARIO: ${{ inputs.scenario }}
        run: |
          set -euo pipefail
          case "$STEP" in
            auto) ;;
            submit|gonogo|publish|ios-supersede) echo "run=true" >> "$GITHUB_OUTPUT"; echo "env=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
            *) echo "run=true" >> "$GITHUB_OUTPUT"; echo "env=false" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          set -- --step plan --dry-run --github-output "$GITHUB_OUTPUT"
          if [ -n "$NOW" ]; then set -- "$@" --now "$NOW"; fi
          if [ -n "$SCENARIO" ]; then set -- "$@" --scenario "tools/release-schedule/scenarios/$SCENARIO.json"; fi
          python3 -I tools/release-schedule/auto.py "$@"

  tick:
    needs: plan
    if: needs.plan.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ needs.plan.outputs.env == 'true' && 'release' || '' }}
    permissions:
      contents: write # freeze commit and tag, schedule slips, the draft release
      actions: write # start CI, acceptance, release.yml and the Discord announcer
      issues: read # release notes from closed issues
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Keys
        env:
          ASC_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          WEBSITE_DEPLOY_KEY: ${{ secrets.WEBSITE_DEPLOY_KEY }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          umask 077
          dir="$RUNNER_TEMP/release-keys"
          mkdir -p "$dir"
          if [ -n "$ASC_KEY_P8" ]; then
            printf '%s' "$ASC_KEY_P8" | base64 --decode > "$dir/asc.p8"
            echo "ASC_KEY_PATH=$dir/asc.p8" >> "$GITHUB_ENV"
          fi
          if [ -n "$WEBSITE_DEPLOY_KEY" ]; then
            printf '%s\n' "$WEBSITE_DEPLOY_KEY" > "$dir/website"
            echo "WEBSITE_DEPLOY_KEY_PATH=$dir/website" >> "$GITHUB_ENV"
          fi
          if [ -n "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" > "$dir/play.json"
            echo "PLAY_SERVICE_ACCOUNT_PATH=$dir/play.json" >> "$GITHUB_ENV"
          fi
      - name: Tick
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          ASC_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          RELEASE_AUTO: ${{ vars.RELEASE_AUTO }}
          RELEASE_HOLD: ${{ vars.RELEASE_HOLD }}
          RELEASE_GIT_NAME: ${{ vars.RELEASE_GIT_NAME }}
          RELEASE_GIT_EMAIL: ${{ vars.RELEASE_GIT_EMAIL }}
          DRY_RUN: ${{ inputs.dry_run }}
          STEP: ${{ inputs.step || 'auto' }}
          VERSION: ${{ inputs.version }}
          NOW: ${{ inputs.now }}
          SCENARIO: ${{ inputs.scenario }}
        run: |
          set -euo pipefail
          set -- --step "$STEP"
          if [ "$DRY_RUN" = true ]; then set -- "$@" --dry-run; fi
          if [ -n "$VERSION" ]; then set -- "$@" --version "$VERSION"; fi
          if [ -n "$NOW" ]; then set -- "$@" --now "$NOW"; fi
          if [ -n "$SCENARIO" ]; then set -- "$@" --scenario "tools/release-schedule/scenarios/$SCENARIO.json"; fi
          status=0
          python3 -I tools/release-schedule/auto.py "$@" 2>&1 | tee "$RUNNER_TEMP/tick.log" || status=$?
          { echo '```'; tail -c 60000 "$RUNNER_TEMP/tick.log"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Remove keys
        if: always()
        run: rm -rf "$RUNNER_TEMP/release-keys"
