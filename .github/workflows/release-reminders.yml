name: Release reminders

# Release milestone reminders -> Discord #mod-chat (tools/release-schedule/remind.py). The planned releases are in
# tools/release-schedule/schedule.json (add one with `plan.py <version> --schedule`). Hourly: an external timer
# dispatches it (GitHub's cron below fires hours late and is only a backup). A reminder stays due for three hours and
# is never posted twice, so a delayed or dropped run is harmless.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only print what would be posted"
        type: boolean
        default: false
      test:
        description: "Post a one-off test message listing the scheduled releases"
        type: boolean
        default: false
      now:
        description: "Pretend it is this time (ISO 8601 with a zone, e.g. 2026-11-08T18:00+02:00); use with dry run"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: release-reminders
  cancel-in-progress: false

jobs:
  remind:
    if: github.repository == 'TeamBorealis/borealis'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/release-schedule
            tools/discord-issues
          persist-credentials: false
      - name: Self-test
        run: python3 -I -m unittest discover -s tools/release-schedule
      - name: Remind
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
          TEST: ${{ inputs.test }}
          NOW: ${{ inputs.now }}
        run: |
          set --
          if [ "$DRY_RUN" = true ]; then set -- "$@" --dry-run; fi
          if [ "$TEST" = true ]; then set -- "$@" --test; fi
          if [ -n "$NOW" ]; then set -- "$@" --now "$NOW"; fi
          python3 -I tools/release-schedule/remind.py "$@"
