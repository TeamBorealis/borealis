name: Discord issues

# Discord #bug-reports / #feature-requests posts -> GitHub issues, and closed issues / releases -> replies in the
# posts (tools/discord-issues/sync.py). Every run does the full idempotent sync; the issue and release triggers only
# make the report-back immediate, and the schedule catches anything a dropped run missed.
on:
  schedule:
    - cron: "*/15 * * * *"
  issues:
    types: [closed]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only print what would be done (no issues, labels, media or Discord replies)"
        type: boolean
        default: false
      announce_tag:
        description: "Post this release's notes to #announcements (blank: don't announce)"
        type: string
        default: ""

permissions:
  contents: write # the orphan discord-media branch that holds rehosted screenshots
  issues: write

concurrency:
  group: discord-issues
  cancel-in-progress: false

jobs:
  sync:
    if: >-
      github.repository == 'TeamBorealis/borealis' &&
      (github.event_name != 'issues' || startsWith(github.event.issue.body, '<!-- discord-thread:'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/discord-issues
          persist-credentials: false
      - name: Self-test
        run: |
          python3 -I tools/discord-issues/test_sync.py
          python3 -I tools/discord-issues/test_announce.py
      - name: Sync
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = true ]; then set -- --dry-run; fi
          python3 -I tools/discord-issues/sync.py "$@"

  # A published release -> its notes in #announcements (tools/discord-issues/announce.py). It replaces GitHub's own
  # Discord webhook post, which only said that a release was published.
  announce:
    if: >-
      github.repository == 'TeamBorealis/borealis' &&
      ((github.event_name == 'release' && !github.event.release.prerelease) ||
       (github.event_name == 'workflow_dispatch' && inputs.announce_tag != ''))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/discord-issues
          persist-credentials: false
      - name: Self-test
        run: python3 -I tools/discord-issues/test_announce.py
      - name: Announce
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.announce_tag }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = true ]; then set -- --dry-run; fi
          python3 -I tools/discord-issues/announce.py --tag "$TAG" "$@"
