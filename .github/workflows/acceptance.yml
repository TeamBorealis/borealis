name: Import acceptance

# IM4/IM6: proves that Aurora XML and 5etools JSON imports work as content sources on Windows and
# Linux, not just macOS. Started by hand only: Actions > Import acceptance > Run workflow, or
# `gh workflow run acceptance.yml --ref <branch>` (needs this file on the default branch), or a
# push to the dedicated branch ci/platform-tests. Never on pull requests or other pushes.
# Privacy (C4/IM6): 5etools data comes only from the BOREALIS_LIVE_5ETOOLS_URL secret, is never
# committed, cached or uploaded, and logs carry counts only (tools/ci/run_filtered.py). Time and
# peak-memory limits per platform and stage: tools/acceptance/thresholds.json (numbers only), checked
# by tools/ci/check_thresholds.py. The installed-app job (bundle + tauri-driver smoke) uploads its
# screenshot only on failure (fresh install, bundled content only; 7 days); nothing else is uploaded.
on:
  workflow_dispatch:
    inputs:
      sources:
        description: "Acceptance sources, comma list of a-user, a-core, a-comm, f-url"
        type: string
        default: a-user,a-core,a-comm,f-url
      deeper:
        description: "Also run the deeper Aurora corpus suites (characters, requirements, index path, migrate, engine sweep)"
        type: boolean
        default: true
      limit:
        description: "BOREALIS_ACCEPT_LIMIT: max class/subclass/feat hosts per source (empty = full run)"
        type: string
        default: ""
      aurora_index_url:
        description: "A-core index URL (live; its nested indexes follow the repository's master branch)"
        type: string
        default: https://raw.githubusercontent.com/AuroraLegacy/elements/master/core.index
  push:
    branches: [ci/platform-tests]

permissions:
  contents: read

concurrency:
  group: acceptance-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Debug info makes the test binaries big enough to exhaust the runner disk (ld Bus error on ubuntu).
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  deterministic:
    # Fixture-only import tests (synthetic + SRD, committed): no corpus, no network, no secret.
    # ci.yml runs the whole workspace on main/PRs; this covers a ci/platform-tests run too.
    name: deterministic import tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Keep LF line endings (Windows)
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - name: Free runner disk (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Linux webkit2gtk deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev libxdo-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: import-deterministic
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
        working-directory: ui
      # Produces ui/dist, which the Tauri crate needs to compile.
      - run: npm run build
        working-directory: ui
      - name: Importer and content crates (incl. the AI-free import guard)
        run: cargo test -p borealis-migrate -p borealis-import-5etools -p borealis-content
      - name: App import tests on fixtures
        run: >-
          cargo test -p borealis
          --test aurora_index --test fivetools_app --test fivetools_url
          --test fivetools_fixture_invariants --test fivetools_renamed_ids
          --test import_preview --test import_review_cmds --test import_bug_report
          --test file_drop --test content_security --test character_recheck --test picked_paths

  acceptance:
    name: IM4 acceptance (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # About 42 min for the full gate suite on an M-series Mac; runners are slower and build cold.
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - name: Git settings (Windows)
        # LF: content files are byte-compared and digested. Long paths: community repos nest deep.
        if: runner.os == 'Windows'
        run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true
      - uses: actions/checkout@v4
      - name: Free runner disk (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Linux webkit2gtk deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev libxdo-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: import-acceptance
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
        working-directory: ui
      - run: npm run build
        working-directory: ui
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: CI helper self-test
        run: python -I tools/ci/test_ci_tools.py

      - name: Plan sources
        id: plan
        env:
          SOURCES_INPUT: ${{ inputs.sources }}
          DEEPER_INPUT: ${{ inputs.deeper }}
          HAS_5ETOOLS_URL: ${{ secrets.BOREALIS_LIVE_5ETOOLS_URL != '' }}
        run: |
          requested="${SOURCES_INPUT:-a-user,a-core,a-comm,f-url}"
          only=""
          for s in ${requested//,/ }; do
            case "$s" in
              a-user|a-core|a-comm) only="$only,$s" ;;
              f-url)
                if [ "$HAS_5ETOOLS_URL" = "true" ]; then
                  only="$only,$s"
                else
                  echo "::notice::f-url skipped: the repository secret BOREALIS_LIVE_5ETOOLS_URL is not set"
                fi ;;
              f-full) echo "::notice::f-full skipped: CI has no 5etools folder (IM6: 5etools comes only from the URL secret, f-url)" ;;
              *) echo "::error::unknown source '$s' (a-user, a-core, a-comm, f-url)"; exit 2 ;;
            esac
          done
          only="${only#,}"
          [ -n "$only" ] || { echo "::error::no source selected"; exit 2; }
          deeper=true
          [ "$DEEPER_INPUT" = "false" ] && deeper=false
          echo "only=$only" >> "$GITHUB_OUTPUT"
          echo "deeper=$deeper" >> "$GITHUB_OUTPUT"
          {
            echo "## IM4 import acceptance, $RUNNER_OS"
            echo ""
            echo "Sources: \`$only\`; deeper Aurora suites: $deeper. Counts only (IM6)."
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fetch pinned Aurora community repositories
        run: python -I tools/ci/fetch_aurora_corpus.py "$RUNNER_TEMP/corpus" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Build release test binaries
        # Unfiltered on purpose: compiler output only, no corpus and no secret in this step.
        id: build
        run: |
          set -e
          cargo test --release --no-run -p borealis --test acceptance
          if [ "${{ steps.plan.outputs.deeper }}" = "true" ]; then
            cargo test --release --no-run -p borealis --test aurora_index_path
            cargo test --release --no-run -p borealis-character --test corpus --test aurora_corpus_reqs --test aurora_corpus_sweep
            cargo test --release --no-run -p borealis-migrate --test corpus
          fi

      - name: Acceptance (a-user, a-core, a-comm, f-url)
        # Same command and variables as tools/regression-gate/gate.py `--only acceptance`.
        env:
          BOREALIS_ACCEPT_ONLY: ${{ steps.plan.outputs.only }}
          BOREALIS_ACCEPT_STRICT: "1"
          BOREALIS_ACCEPT_LIMIT: ${{ inputs.limit }}
          BOREALIS_CORPUS_DIR: ${{ runner.temp }}/corpus
          BOREALIS_LIVE_INDEX_URL: ${{ inputs.aurora_index_url || 'https://raw.githubusercontent.com/AuroraLegacy/elements/master/core.index' }}
          BOREALIS_LIVE_5ETOOLS_URL: ${{ secrets.BOREALIS_LIVE_5ETOOLS_URL }}
          # Downloads and installed packs stay in a run-scoped temp dir that the last step deletes.
          TMPDIR: ${{ runner.temp }}/acc-tmp
          TMP: ${{ runner.temp }}/acc-tmp
          TEMP: ${{ runner.temp }}/acc-tmp
        run: |
          python -I -c "import os; os.makedirs(os.environ['TMP'], exist_ok=True)"
          [ -n "$BOREALIS_ACCEPT_LIMIT" ] || unset BOREALIS_ACCEPT_LIMIT
          [ -n "$BOREALIS_LIVE_5ETOOLS_URL" ] || unset BOREALIS_LIVE_5ETOOLS_URL
          # The tee'd copy holds only the filtered lines (counts and METRIC numbers) for the threshold check.
          python -I tools/ci/run_filtered.py --label "acceptance ($RUNNER_OS)" --peak-metric acceptance \
            -- -p borealis --test acceptance -- --color never | tee "$RUNNER_TEMP/acceptance-metrics.log"

      - name: Time and memory thresholds
        # wall_s per source/stage and the test process's peak_mem_mb against tools/acceptance/thresholds.json.
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: python -I tools/ci/check_thresholds.py --platform "desktop-${RUNNER_OS,,}" "$RUNNER_TEMP/acceptance-metrics.log"

      - name: Deeper Aurora corpus suites
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.plan.outputs.deeper == 'true' }}
        env:
          CORPUS: ${{ runner.temp }}/corpus
          TMPDIR: ${{ runner.temp }}/acc-tmp
          TMP: ${{ runner.temp }}/acc-tmp
          TEMP: ${{ runner.temp }}/acc-tmp
        run: |
          python -I -c "import os; os.makedirs(os.environ['TMP'], exist_ok=True)"
          rc=0
          run() { label=$1; shift; python -I tools/ci/run_filtered.py --label "$label ($RUNNER_OS)" -- "$@" -- --color never || rc=1; }
          export BOREALIS_CORPUS_DIR="$CORPUS"
          run "aurora characters" -p borealis-character --test corpus
          run "aurora requirements" -p borealis-character --test aurora_corpus_reqs
          run "aurora index path" -p borealis --test aurora_index_path
          run "aurora engine sweep" -p borealis-character --test aurora_corpus_sweep
          export BOREALIS_CORPUS_DIR="$CORPUS/repos"  # the migrate sweep takes the repos folder (gate.py)
          run "aurora migrate corpus" -p borealis-migrate --test corpus
          exit $rc

      - name: Delete downloaded and imported content
        # Before rust-cache's post step saves target/: nothing imported may reach a cache.
        if: always()
        run: >-
          python -I -c "import shutil, sys; [shutil.rmtree(p, ignore_errors=True) for p in sys.argv[1:]]"
          "$RUNNER_TEMP/acc-tmp" "$RUNNER_TEMP/corpus" target/tmp target/release/tmp

  installed-app:
    # Spec S5 (Windows, Ubuntu): the installer bundle installs, the app starts, its main window shows the
    # start page and the content screen opens, driven through tauri-driver (WebDriver). Fresh install,
    # bundled content only: no corpus, no secret.
    # Linux: release deb installed; WebKitWebDriver (webkit2gtk-driver) under Xvfb drives the INSTALLED app.
    # Windows: the BLOCKING proof is the launch check: the NSIS-installed exe starts, stays up and shows a
    # window titled Borealis. WebDriver on Windows is NON-BLOCKING: on the hosted runner msedgedriver
    # starts the app (it runs: window, WebView2 processes, clean log) but the WebView2 browser never
    # writes DevToolsActivePort within msedgedriver's 60 s, with release, debug, installed and
    # target/debug exes alike and the driver = WebView2 runtime = Edge version (runs 39317258271,
    # 39332189035, 39345166739). The steps that follow record why: tauri-driver on target/debug (as
    # Tauri's WebDriver docs), msedgedriver direct with its verbose launch lines, then a probe that starts
    # the app with a fixed remote-debugging port and, if that port answers, attaches msedgedriver to it
    # (debuggerAddress, Microsoft's documented WebView2 attach) and runs the same smoke.
    name: installed app smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep LF line endings (Windows)
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - name: Free runner disk (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Linux webkit2gtk, WebKitWebDriver and Xvfb
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev libxdo-dev \
            webkit2gtk-driver xvfb xauth dbus-x11
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: installed-app
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
        working-directory: ui
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the installer bundle
        # beforeBuildCommand builds ui/dist. Linux: release deb only (AppImage is slow and not installed here);
        # WebKitWebDriver drives a release build. Windows: debug NSIS installer, as Tauri's WebDriver docs and
        # CI example build the app under test: a release build has the WebView2 DevTools off, so its webview
        # opens no remote-debugging port and msedgedriver fails with "DevToolsActivePort file doesn't exist"
        # (run 39317258271). The debug exe is console-subsystem; harmless here.
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            node ui/node_modules/@tauri-apps/cli/tauri.js build --bundles deb
          else
            node ui/node_modules/@tauri-apps/cli/tauri.js build --debug --bundles nsis
          fi

      - name: Install the bundle (Linux)
        id: install-linux
        if: runner.os == 'Linux'
        run: |
          debs=(target/release/bundle/deb/*.deb)
          sudo apt-get install -y "./${debs[0]}"
          echo "app=$(command -v borealis)" >> "$GITHUB_OUTPUT"
      - name: Install the bundle (Windows)
        id: install-windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = Get-ChildItem target/debug/bundle/nsis/*-setup.exe | Select-Object -First 1
          if (-not $setup) { Write-Output '::error::no NSIS installer under target/debug/bundle/nsis'; exit 1 }
          Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait
          $exe = Get-ChildItem (Join-Path $env:LOCALAPPDATA 'Borealis') -Filter *.exe |
            Where-Object { $_.Name -notmatch '^uninstall' } | Select-Object -First 1
          if (-not $exe) { Write-Output '::error::the installer put no app exe under %LOCALAPPDATA%\Borealis'; exit 1 }
          "app=$($exe.FullName)" >> $env:GITHUB_OUTPUT

      - name: Install tauri-driver
        run: cargo install tauri-driver --locked

      - name: msedgedriver matching the WebView2 runtime (Windows)
        id: edgedriver
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $key = 'SOFTWARE\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $wv = @("HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}", "HKLM:\$key", "HKCU:\$key") |
            ForEach-Object { (Get-ItemProperty $_ -ErrorAction SilentlyContinue).pv } | Where-Object { $_ } | Select-Object -First 1
          if (-not $wv) { $wv = (Get-Item "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe").VersionInfo.ProductVersion }
          Write-Output "WebView2 runtime $wv"
          $driver = $null
          if ($env:EDGEWEBDRIVER) {
            $pre = Join-Path $env:EDGEWEBDRIVER 'msedgedriver.exe'
            if (Test-Path $pre) {
              $have = [regex]::Match((& $pre --version), '\d+\.\d+\.\d+\.\d+').Value
              Write-Output "runner msedgedriver $have"
              if ($have.Split('.')[0] -eq $wv.Split('.')[0]) { $driver = $pre }
            }
          }
          if (-not $driver) {
            $dir = Join-Path $env:RUNNER_TEMP 'edgedriver'
            New-Item -ItemType Directory -Force $dir | Out-Null
            $zip = Join-Path $dir 'edgedriver.zip'
            Invoke-WebRequest "https://msedgedriver.microsoft.com/$wv/edgedriver_win64.zip" -OutFile $zip
            Expand-Archive $zip -DestinationPath $dir -Force
            $driver = Join-Path $dir 'msedgedriver.exe'
          }
          # Diagnostics (numbers only): the driver's major must equal the WebView2 runtime's, not Edge's.
          $edge = (Get-Item "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe" -ErrorAction SilentlyContinue).VersionInfo.ProductVersion
          $used = [regex]::Match((& $driver --version), '\d+\.\d+\.\d+\.\d+').Value
          Write-Output "versions: WebView2 runtime $wv; msedgedriver $used; Edge browser $edge"
          if ($used.Split('.')[0] -ne $wv.Split('.')[0]) { Write-Output "::error::msedgedriver $used does not match WebView2 $wv"; exit 1 }
          "driver=$driver" >> $env:GITHUB_OUTPUT

      - name: Installed app launches and stays up (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          APP: ${{ steps.install-windows.outputs.app }}
        run: |
          $p = Start-Process -FilePath $env:APP -PassThru
          $null = $p.Handle  # keeps the exit code readable after exit
          $title = ''
          for ($i = 1; $i -le 60 -and -not $p.HasExited; $i++) {
            Start-Sleep -Seconds 1
            $p.Refresh()
            if ($p.MainWindowTitle) { $title = $p.MainWindowTitle }
            if ($i -ge 15 -and $title) { break }
          }
          $alive = -not $p.HasExited
          $code = if ($alive) { '-' } else { $p.ExitCode }
          $wv = @(Get-Process msedgewebview2 -ErrorAction SilentlyContinue).Count
          Write-Output "installed app: alive $alive after $i s; exit code $code; window title '$title'; msedgewebview2 processes $wv"
          # App log (<app data>/logs): line counts and the first error lines, cut short.
          $logs = Get-ChildItem "$env:APPDATA\app.borealis\logs", "$env:LOCALAPPDATA\app.borealis\logs" -Filter *.log -ErrorAction SilentlyContinue
          foreach ($f in $logs) {
            $lines = @(Get-Content $f.FullName)
            $err = @($lines | Select-String -Pattern 'ERROR|panic')
            Write-Output "app log $($f.Name): $($lines.Count) lines, $($err.Count) error lines"
            $err | Select-Object -First 3 | ForEach-Object { '  ' + $_.Line.Substring(0, [Math]::Min(160, $_.Line.Length)) }
          }
          if (-not $logs) { Write-Output 'app log: none' }
          # Leave no app or webview process behind for the WebDriver step (it shares the data folder).
          Get-Process borealis, msedgewebview2 -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 3
          if (-not $alive) { Write-Output "::error::the installed app exited at start (exit code $code)"; exit 1 }
          if ($title -notmatch 'Borealis') { Write-Output "::error::the installed app shows no window titled Borealis"; exit 1 }

      - name: WebDriver smoke (Linux installed app, Windows target/debug exe)
        id: smoke
        # Blocking on Linux; recorded only on Windows (see the job comment).
        continue-on-error: ${{ runner.os == 'Windows' }}
        env:
          APP: ${{ steps.install-linux.outputs.app || format('{0}\target\debug\borealis.exe', github.workspace) }}
          NATIVE_DRIVER: ${{ steps.edgedriver.outputs.driver }}
          # Software rendering under Xvfb (as build/linux/smoke.sh).
          WEBKIT_DISABLE_COMPOSITING_MODE: "1"
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
          LIBGL_ALWAYS_SOFTWARE: "1"
          NO_AT_BRIDGE: "1"
        run: |
          mkdir -p "$RUNNER_TEMP/smoke"
          # tauri-driver by name: cargo's bin folder is on PATH (and Windows appends .exe).
          set -- python -I tools/ci/webdriver_smoke.py --tauri-driver tauri-driver \
            --app "$APP" --screenshot "$RUNNER_TEMP/smoke/installed-app.png"
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a -s "-screen 0 1400x900x24" dbus-run-session -- "$@"
          else
            "$@" --native-driver "$NATIVE_DRIVER"
          fi
      - name: WebDriver diagnostics, msedgedriver direct with a verbose log (Windows, on failure)
        if: ${{ !cancelled() && runner.os == 'Windows' && steps.smoke.outcome == 'failure' }}
        continue-on-error: true
        env:
          APP: ${{ format('{0}\target\debug\borealis.exe', github.workspace) }}
          NATIVE_DRIVER: ${{ steps.edgedriver.outputs.driver }}
        run: |
          echo "::warning::Windows WebDriver smoke failed (non-blocking; the launch check is the Windows proof)"
          python -I tools/ci/webdriver_smoke.py --msedgedriver "$NATIVE_DRIVER" --port 4446 --timeout 90 \
            --app "$APP" --driver-log "$RUNNER_TEMP/msedgedriver-verbose.log" || true
          rm -f "$RUNNER_TEMP/msedgedriver-verbose.log"
      - name: WebDriver attach probe, app started with a remote-debugging port (Windows, on failure)
        if: ${{ !cancelled() && runner.os == 'Windows' && steps.smoke.outcome == 'failure' }}
        continue-on-error: true
        shell: pwsh
        env:
          APP: ${{ format('{0}\target\debug\borealis.exe', github.workspace) }}
          NATIVE_DRIVER: ${{ steps.edgedriver.outputs.driver }}
        run: |
          # B-28: which launch route gets --remote-debugging-port into WebView2? A = Start-Process with the
          # environment variable, B = CreateProcess with an explicit environment block (no shell execute),
          # C = the per-executable registry override WebView2 documents. Flags and paths only.
          $port = 9222
          $flag = "--remote-debugging-port=$port"
          $exe = Split-Path $env:APP -Leaf
          $regKey = 'HKCU:\Software\Policies\Microsoft\Edge\WebView2\AdditionalBrowserArguments'
          function Stop-App { Get-Process borealis, msedgewebview2 -ErrorAction SilentlyContinue | Stop-Process -Force; Start-Sleep -Seconds 2 }
          function Report([string]$route) {
            Start-Sleep -Seconds 20
            $wv = @(Get-CimInstance Win32_Process -Filter "Name='msedgewebview2.exe'")
            $with = @($wv | Where-Object { $_.CommandLine -match [regex]::Escape($flag) }).Count
            $browser = $wv | Where-Object { $_.CommandLine -notmatch '--type=' } | Select-Object -First 1
            $names = if ($browser) { ([regex]::Matches($browser.CommandLine, '--[a-z0-9-]+') | ForEach-Object Value | Select-Object -Unique) -join ' ' } else { 'no browser process' }
            $dirs = @($wv | ForEach-Object { if ($_.CommandLine -match '--user-data-dir="?([^"]+?)"?(\s|$)') { $Matches[1] } } | Select-Object -Unique)
            $dtp = @(Get-ChildItem $dirs -Filter DevToolsActivePort -ErrorAction SilentlyContinue).Count
            $ok = $false
            try { Invoke-RestMethod "http://127.0.0.1:$port/json/version" -TimeoutSec 10 | Out-Null; $ok = $true } catch {}
            Write-Host "probe $route`: msedgewebview2 $($wv.Count), with the port flag $with, DevToolsActivePort $dtp, port answers $ok"
            Write-Host "probe $route browser flags: $names"
            return $ok
          }
          Write-Output "probe: WebView2 driver $(& $env:NATIVE_DRIVER --version)"
          $results = @{}
          Stop-App
          $env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS = $flag
          $p = Start-Process -FilePath $env:APP -PassThru
          $results['A'] = Report 'A'
          Remove-Item Env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS
          Stop-App
          $psi = New-Object System.Diagnostics.ProcessStartInfo $env:APP
          $psi.UseShellExecute = $false
          $psi.Environment['WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS'] = $flag
          $p = [System.Diagnostics.Process]::Start($psi)
          $results['B'] = Report 'B'
          Stop-App
          New-Item -Path $regKey -Force | Out-Null
          New-ItemProperty -Path $regKey -Name $exe -Value $flag -PropertyType String -Force | Out-Null
          $p = Start-Process -FilePath $env:APP -PassThru
          $results['C'] = Report 'C'
          $rc = 1
          if ($results['C']) {
            python -I tools/ci/webdriver_smoke.py --msedgedriver $env:NATIVE_DRIVER --port 4447 --timeout 90 `
              --debugger-address "127.0.0.1:$port"
            $rc = $LASTEXITCODE
          }
          Remove-ItemProperty -Path $regKey -Name $exe -ErrorAction SilentlyContinue
          Stop-App
          Write-Output "probe: routes $(($results.GetEnumerator() | Sort-Object Name | ForEach-Object { "$($_.Name)=$($_.Value)" }) -join ' '); attach smoke (C) exit $rc"
          exit $rc
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: installed-app-smoke-${{ matrix.os }}
          path: ${{ runner.temp }}/smoke/
          retention-days: 7
          if-no-files-found: ignore
