name: CI

# Cost-aware: push/PR run Linux + Windows only. macOS (10x minutes), iOS, Android and the x86_64 embedding matrix
# (embed-platforms) run only when started by hand (Actions > CI > Run workflow).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      only_embed:
        description: "Run only the x86_64 embedding matrix (embed-platforms, S3.4), not the build/test/bundle jobs"
        type: boolean
        default: false
      only_bundle:
        description: "Run only the Linux / Windows desktop bundle jobs (installed-bundle and old-CPU smokes, B-49)"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Debug info makes the test binaries big enough to exhaust the runner disk (ld Bus error on ubuntu).
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  test:
    name: build+test (${{ matrix.os }})
    if: ${{ !inputs.only_embed && !inputs.only_bundle }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Keep LF line endings (Windows)
        # The AI profile is hash-verified and content files are byte-compared; CRLF breaks both.
        if: runner.os == 'Windows'
        run: |
          git config --global core.autocrlf false
          # llama.cpp (the borealis-embed git dependency) has paths longer than MAX_PATH.
          git config --global core.longpaths true
      - uses: actions/checkout@v4
      - name: Free runner disk (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Linux webkit2gtk deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev libxdo-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: test
      # A llama.cpp build cached from before the x86_64 baseline (S3.3) or the MSVC hybrid runtime (B-56) keeps its
      # CMake cache (cmake does not reconfigure an existing build): rebuild it once.
      - name: Drop a stale llama.cpp build
        shell: bash
        run: bash build/ci/drop-stale-llama-build.sh target/debug
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
        working-directory: ui
      - name: UI tests (platform independent, Linux only)
        if: runner.os == 'Linux'
        run: npm test
        working-directory: ui
      # Also produces ui/dist, which the Tauri crate needs to compile.
      - run: npm run build
        working-directory: ui
      # The e2e suite is TypeScript too: typecheck it next to the UI (no browser needed).
      - name: e2e typecheck (Linux only)
        if: runner.os == 'Linux'
        run: |
          npm ci
          npm run typecheck
        working-directory: e2e
      - name: rustfmt (Linux only)
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --no-fail-fast --no-run
      # B-49: Windows test binaries import llama.cpp's DLLs, which llama-cpp-sys-2 leaves in its out/bin folder
      # (it does not copy them next to the binaries on MSVC).
      - name: llama.cpp DLLs on PATH (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: for d in target/debug/build/llama-cpp-sys-2-*/out/bin; do if [ -d "$d" ]; then cygpath -w "$(cd "$d" && pwd)" >> "$GITHUB_PATH"; fi; done
      - run: cargo test --workspace --no-fail-fast
      # llama.cpp's core libraries use only the SSE2 baseline on x86_64 (no AVX code that crashes older CPUs, S3.3),
      # and each CPU backend module stays within its x86 level (B-49).
      - name: llama.cpp x86 levels (Linux only)
        if: runner.os == 'Linux'
        run: bash build/check-x86-baseline.sh --require-modules target/debug

  audit:
    name: dependency audit
    if: ${{ !inputs.only_embed && !inputs.only_bundle }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo audit
        # Warnings (the known unmaintained-crate advisories) do not fail the job; vulnerabilities do.
        run: |
          cargo install cargo-audit --locked
          cargo audit
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm audit --omit=dev --audit-level=high
        working-directory: ui

  desktop-bundle:
    name: desktop bundle (${{ matrix.os }})
    needs: test
    if: ${{ !cancelled() && !inputs.only_embed && (inputs.only_bundle || needs.test.result == 'success') }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Release builds: the Windows debug exe is console-subsystem (a console window opens).
        # Linux: deb + AppImage (tauri.linux.conf.json); Windows: unsigned NSIS installer
        # (tauri.windows.conf.json).
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Keep LF line endings (Windows)
        if: runner.os == 'Windows'
        run: |
          git config --global core.autocrlf false
          # llama.cpp (the borealis-embed git dependency) has paths longer than MAX_PATH.
          git config --global core.longpaths true
      - uses: actions/checkout@v4
      - name: Free runner disk (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Linux webkit2gtk deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev libxdo-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: bundle
      - name: Drop a stale llama.cpp build
        shell: bash
        run: bash build/ci/drop-stale-llama-build.sh target/release
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
        working-directory: ui
      # B-49: x86_64 Windows / Linux ship llama.cpp as shared libraries plus one CPU backend module per x86 level.
      # Build the app once (the Tauri build reuses it), stage the libraries, and bundle them through the Tauri
      # config overlay the staging script writes (release.yml does the same).
      - name: Build and stage llama.cpp's libraries (B-49)
        shell: bash
        run: |
          npm --prefix ui run build
          cargo build --release -p borealis
          bash build/stage-ggml-libs.sh target/release target/ggml-bundle
      - uses: tauri-apps/tauri-action@v0
        with:
          projectPath: .
          # Through node: Windows cannot run the extension-less .bin/tauri shim by path.
          tauriScript: node ui/node_modules/@tauri-apps/cli/tauri.js
          args: --config target/ggml-bundle/tauri.conf.json
      - name: Bundle sizes
        shell: bash
        run: |
          mkdir -p bundle-record
          {
            find target/release/bundle -maxdepth 2 -type f \( -name '*.exe' -o -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \) \
              -exec ls -l {} +
            find target/release -maxdepth 1 -type f \( -name borealis -o -name borealis.exe \) -exec ls -l {} +
            echo "staged llama.cpp library bytes: $(find target/ggml-bundle -type f \( -name '*.dll' -o -name '*.so' \) -exec cat {} + | wc -c)"
          } | tee bundle-record/sizes.txt
      # The core libraries stay at SSE2 (X86-1) and every CPU backend module within its level (B-49): the release
      # build, plus the libraries the installers really carry (deb data / staged folder).
      - name: llama.cpp x86 levels (Linux, release build and the deb's libraries)
        if: runner.os == 'Linux'
        run: bash build/check-x86-baseline.sh --require-modules target/release target/release/bundle/deb | tee bundle-record/x86-levels.txt
      - name: llama.cpp x86 levels (Windows dumpbin, release build and the staged libraries)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./build/check-x86-baseline.ps1 target/release -Also target/ggml-bundle -RequireModules | Tee-Object -FilePath bundle-record/x86-levels.txt
      # B-56: neither the exe nor any llama.cpp DLL or CPU backend module imports the VC++ runtime (msvcp140,
      # vcruntime140*): the app must start on a PC without the Visual C++ redistributable.
      - name: No VC++ runtime imports (Windows dumpbin, release build, staged libraries, installer)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = Get-ChildItem target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          ./build/check-no-vc-runtime.ps1 target/release/borealis.exe target/ggml-bundle $setup.FullName -Require borealis.exe, llama.dll, ggml.dll, ggml-base.dll, ggml-cpu-x64.dll | Tee-Object -FilePath bundle-record/vc-runtime-build.txt
          exit $LASTEXITCODE
      # B-49: install the bundles and start llama.cpp from the installed app: the CPU backend module must load from
      # the install folder (AVX2 or better on these runners).
      - name: Installed bundles load their CPU backend (Linux deb, rpm, AppImage)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y rpm2cpio cpio "./$(ls target/release/bundle/deb/*.deb | head -n 1)"
          find /usr/lib/Borealis/ggml -maxdepth 1 -type f | sort
          ldd /usr/bin/borealis | grep -E 'llama|ggml'
          fast='haswell|alderlake|skylakex|cannonlake|cascadelake|icelake|cooperlake|zen4|sapphirerapids'
          bash build/ci/semantic-backend-smoke.sh bundle-record deb 'from /usr/bin/\.\./lib/Borealis/ggml/libggml-cpu-' "$fast" /usr/bin/borealis
          mkdir -p rpm-root && (cd rpm-root && rpm2cpio "$(ls ../target/release/bundle/rpm/*.rpm | head -n 1)" | cpio -idm --quiet)
          bash build/ci/semantic-backend-smoke.sh bundle-record rpm 'rpm-root/usr/bin/\.\./lib/Borealis/ggml/libggml-cpu-' "$fast" rpm-root/usr/bin/borealis
          appimage=$(ls target/release/bundle/appimage/*.AppImage | head -n 1)
          chmod +x "$appimage"
          APPIMAGE_EXTRACT_AND_RUN=1 bash build/ci/semantic-backend-smoke.sh bundle-record appimage 'usr/bin/\.\./lib/Borealis/ggml/libggml-cpu-' "$fast" "$appimage"
      - name: Linux launch smoke of the installed app (Xvfb)
        # Launches the installed binary headless: GUI stays up, main window maps, --mcp answers on stdio.
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y xvfb xauth dbus-x11 xdotool imagemagick
          build/linux/smoke.sh /usr/bin/borealis linux-smoke ci
      # From PowerShell: Git Bash would turn the installer's `/S` into a path (MSYS argument conversion).
      - name: Install the NSIS bundle (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 15
        shell: pwsh
        run: |
          $setup = Get-ChildItem target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait
          $app = Join-Path $env:LOCALAPPDATA 'Borealis\borealis.exe'
          Get-ChildItem (Join-Path $env:LOCALAPPDATA 'Borealis'), (Join-Path $env:LOCALAPPDATA 'Borealis\ggml') | Format-Table Name, Length
          if (-not (Test-Path $app)) { Write-Output "::error::the installer put no $app"; exit 1 }
          "INSTALLED_APP=$app" >> $env:GITHUB_ENV
      - name: No VC++ runtime imports (Windows, the NSIS-installed files)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./build/check-no-vc-runtime.ps1 (Split-Path $env:INSTALLED_APP) -Require borealis.exe, llama.dll, ggml.dll, ggml-base.dll, ggml-cpu-x64.dll | Tee-Object -FilePath bundle-record/vc-runtime-installed.txt
          exit $LASTEXITCODE
      # The installed app starts and stays up with its main window (the runner has the VC++ runtime, so the import
      # checks above, not this, prove it is not needed). Lists any VC++ runtime DLL the process has loaded anyway.
      - name: Installed app launch smoke (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath $env:INSTALLED_APP -PassThru
          $title = ''
          for ($i = 1; $i -le 20; $i++) {
            Start-Sleep -Seconds 1
            $p.Refresh()
            if ($p.HasExited) { break }
            if (-not $title -and $p.MainWindowTitle) { $title = $p.MainWindowTitle }
          }
          $alive = -not $p.HasExited
          $vc = if ($alive) { @($p.Modules | Where-Object ModuleName -match '^(msvcp|vcruntime)\d' | ForEach-Object FileName) } else { @() }
          Write-Output "launch: alive $alive after $i s; window title '$title'; VC++ runtime modules loaded: $(if ($vc) { $vc -join ', ' } else { 'none' })"
          "{`"label`":`"launch`",`"alive`":`"$alive`",`"window`":`"$title`",`"vc_runtime_loaded`":`"$($vc -join ';')`"}" | Out-File -Encoding ascii bundle-record/launch.json
          if ($alive) { Stop-Process -Id $p.Id -Force }
          Get-Process msedgewebview2 -ErrorAction SilentlyContinue | Stop-Process -Force
          if (-not $alive) { Write-Output "::error::the installed app exited within 20 s (exit code $($p.ExitCode))"; exit 1 }
          if (-not $title) { Write-Output '::error::the installed app showed no main window within 20 s'; exit 1 }
      - name: Installed app loads its CPU backend (Windows NSIS)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          app=$(cygpath -u "$INSTALLED_APP")
          fast='haswell|alderlake|skylakex|cannonlake|cascadelake|icelake|cooperlake|zen4|sapphirerapids'
          bash build/ci/semantic-backend-smoke.sh bundle-record nsis 'Borealis\\ggml\\ggml-cpu-' "$fast" "$app"
      # The installed app's own speed check with the real model (manual runs; the model comes from the app's pinned
      # sources and is cached, never uploaded).
      - uses: actions/cache@v4
        if: ${{ github.event_name == 'workflow_dispatch' }}
        with:
          path: ${{ runner.temp }}/borealis-models
          key: embed-model-${{ hashFiles('crates/borealis-embed/src/models.rs') }}
      - name: Installed app's speed check with the model (manual)
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          dir=$(cd "$RUNNER_TEMP" && pwd)/borealis-models
          model=$(bash build/fetch-embed-model.sh "$dir" | tail -n 1)
          if [ "$RUNNER_OS" = Windows ]; then
            app=$(cygpath -u "$INSTALLED_APP"); model=$(cygpath -w "$model"); where='Borealis\\ggml\\ggml-cpu-'
          else
            app=/usr/bin/borealis; where='/lib/Borealis/ggml/libggml-cpu-'
          fi
          bash build/ci/semantic-backend-smoke.sh bundle-record installed-speed "$where" '[a-z0-9_]+' "$app" ++ --model "$model"
      # Old CPUs (manual runs): the installed app on an emulated Core 2 (no SSE4.2, no AVX) loads the SSE2 module
      # (ggml-cpu-x64), keyword search answers, and the GUI starts, with no illegal instruction. Linux: qemu-user
      # `-cpu Conroe`; Windows: Intel SDE `-mrm` (Merom).
      - name: Installed app on a pre-AVX CPU (Linux, qemu-user -cpu Conroe)
        if: ${{ !cancelled() && runner.os == 'Linux' && github.event_name == 'workflow_dispatch' }}
        timeout-minutes: 60
        run: |
          sudo apt-get install -y qemu-user
          bash build/ci/semantic-backend-smoke.sh bundle-record conroe '/lib/Borealis/ggml/libggml-cpu-' x64 qemu-x86_64 -cpu Conroe /usr/bin/borealis
          bash build/ci/mcp-search-smoke.sh bundle-record conroe qemu-x86_64 -cpu Conroe /usr/bin/borealis
          export DISPLAY=:98 WEBKIT_DISABLE_COMPOSITING_MODE=1 WEBKIT_DISABLE_DMABUF_RENDERER=1 LIBGL_ALWAYS_SOFTWARE=1 NO_AT_BRIDGE=1
          Xvfb :98 -screen 0 1400x900x24 -nolisten tcp > /tmp/xvfb98.log 2>&1 &
          sleep 1
          dbus-run-session -- qemu-x86_64 -cpu Conroe /usr/bin/borealis > bundle-record/conroe-gui.log 2>&1 &
          pid=$!
          for i in $(seq 1 120); do
            sleep 1
            if xdotool search --name '^Borealis$' > /dev/null 2>&1; then break; fi
            kill -0 "$pid" 2> /dev/null || break
          done
          sleep 10
          alive=no; kill -0 "$pid" 2> /dev/null && alive=yes
          window=$(xdotool search --name '^Borealis$' 2> /dev/null | head -n 1)
          echo "gui under qemu -cpu Conroe: alive $alive after $((i + 10)) s; main window ${window:-none}"
          grep -iE 'uncaught target signal|illegal instruction' bundle-record/conroe-gui.log | head -n 3 || true
          printf '{"label":"conroe-gui","alive":"%s","window":"%s"}\n' "$alive" "${window:-}" > bundle-record/conroe-gui.json
          kill "$pid" 2> /dev/null || true
          if [ "$alive" != yes ] || [ -z "$window" ]; then echo "::error::the GUI did not stay up under qemu -cpu Conroe"; tail -n 20 bundle-record/conroe-gui.log; exit 1; fi
      - uses: petarpetrovt/setup-sde@6d2773bc0ef3005fd52e0ae0bb91782321793aec # v6.0
        if: ${{ !cancelled() && runner.os == 'Windows' && github.event_name == 'workflow_dispatch' }}
      # s3.3-1 sec. 7 item 3: the installed release app starts on a pre-AVX CPU (Intel SDE, Merom = Core 2). An AVX
      # instruction anywhere on the start path (C++ static initialisers of the ggml libraries included) stops it with an
      # SDE error. Checks the CPU backend (the SSE2 module), keyword search over MCP, and that the GUI stays up.
      - name: Installed app on a pre-AVX CPU (Windows, Intel SDE -mrm)
        if: ${{ !cancelled() && runner.os == 'Windows' && github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          sde=$(find "$(cygpath -u "$SDE_PATH")" -name sde.exe | head -n 1)
          app=$(cygpath -w "$INSTALLED_APP")
          bash build/ci/semantic-backend-smoke.sh bundle-record sde 'Borealis\\ggml\\ggml-cpu-' x64 "$sde" -mrm -- "$app"
          bash build/ci/mcp-search-smoke.sh bundle-record sde "$sde" -mrm -- "$app"
      - name: Installed app's GUI on a pre-AVX CPU (Windows, Intel SDE -mrm)
        if: ${{ !cancelled() && runner.os == 'Windows' && github.event_name == 'workflow_dispatch' }}
        shell: pwsh
        run: |
          $sde = Get-ChildItem -Path $env:SDE_PATH -Recurse -Filter sde.exe | Select-Object -First 1 -ExpandProperty FullName
          $app = (Resolve-Path $env:INSTALLED_APP).Path
          $p = Start-Process -FilePath $sde -ArgumentList @('-mrm', '--', "`"$app`"") -PassThru -RedirectStandardOutput sde-gui.out -RedirectStandardError sde-gui.err
          $title = ''
          for ($i = 1; $i -le 180; $i++) {
            Start-Sleep -Seconds 1
            $b = Get-Process borealis -ErrorAction SilentlyContinue | Where-Object MainWindowTitle | Select-Object -First 1
            if ($b) { $title = $b.MainWindowTitle; break }
            if ($p.HasExited) { break }
          }
          $alive = -not $p.HasExited
          Write-Output "gui under SDE: alive $alive after $i s; window title '$title'"
          Get-Content sde-gui.out, sde-gui.err -ErrorAction SilentlyContinue | Select-String -Pattern 'SDE-ERROR|not valid for specified chip' | Select-Object -First 3
          "{`"label`":`"sde-gui`",`"alive`":`"$alive`",`"window`":`"$title`"}" | Out-File -Encoding ascii bundle-record/sde-gui.json
          Get-Process borealis, msedgewebview2, sde* -ErrorAction SilentlyContinue | Stop-Process -Force
          if (-not $alive) { Write-Output '::error::the installed app exited under SDE -mrm'; exit 1 }
      - name: Record
        if: always()
        shell: bash
        run: |
          {
            echo "### Desktop bundle on ${{ matrix.os }}"
            for f in bundle-record/*.json; do
              if [ -f "$f" ]; then echo "- $(basename "$f"): \`$(head -c 1500 "$f")\`"; fi
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bundle-record-${{ matrix.os }}
          path: bundle-record/
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux' && always()
        with:
          name: linux-smoke-screenshots
          path: linux-smoke/
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.os }}
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/rpm/*.rpm
          if-no-files-found: error

  macos:
    name: macOS build+test+bundle (manual)
    if: github.event_name == 'workflow_dispatch' && !inputs.only_embed && !inputs.only_bundle
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
        working-directory: ui
      - run: npm run build
        working-directory: ui
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - uses: tauri-apps/tauri-action@v0
        with:
          projectPath: .
          tauriScript: node ui/node_modules/@tauri-apps/cli/tauri.js
          args: --debug
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-macos-latest
          path: target/debug/bundle/dmg/*.dmg
          if-no-files-found: error

  ios:
    name: iOS build (manual, experimental)
    if: github.event_name == 'workflow_dispatch' && !inputs.only_embed && !inputs.only_bundle
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
        working-directory: ui
      - run: node ui/node_modules/@tauri-apps/cli/tauri.js ios init --ci
      - run: node ui/node_modules/@tauri-apps/cli/tauri.js ios build --debug --target aarch64-sim --ci

  android:
    name: Android build (manual, experimental)
    if: github.event_name == 'workflow_dispatch' && !inputs.only_embed && !inputs.only_bundle
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          # The action's default list also asks for the legacy `tools` package, which current command-line
          # tools no longer offer (sdkmanager exits 1: "Failed to find package 'tools'").
          packages: platform-tools
      - name: Install NDK
        run: sdkmanager "ndk;27.0.12077973" "platforms;android-34" "build-tools;34.0.0"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
        working-directory: ui
      - name: Build
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973
          # llama.cpp (llama-cpp-sys-2) reads ANDROID_NDK, not NDK_HOME; without it it picks the newest NDK
          # under ANDROID_HOME, which need not be the one the Rust linker uses.
          ANDROID_NDK: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973
        run: |
          # gen/android is committed; `android init` would rewrite buildSrc/BuildTask.kt to call the CLI by a relative
          # path that Gradle cannot resolve, so build straight from the committed project (as release.yml does).
          node "$GITHUB_WORKSPACE/ui/node_modules/@tauri-apps/cli/tauri.js" android build --debug --apk --target aarch64 --ci

  embed-platforms:
    # S3.4 (s3.3-1 sec. 7 items 3-6) and B-49: the real embedding model on x86_64 with llama.cpp's run-time CPU
    # backend (the best ggml-cpu-<level> module for the runner's CPU; each record names the level that loaded).
    # Cosine vs the sentence-transformers fp32 reference (>= 0.99 at 768 and 256 dims), the speed record
    # (query_ms_median, chunks/s), the app's own speed check against the 40 ms budget, the level checks, and old-CPU
    # runs on the SSE2 module: qemu-user `-cpu Conroe` (Core 2, no AVX) on Linux, Intel SDE `-mrm` (Merom) on Windows. The model comes from
    # the app's pinned sources (build/fetch-embed-model.sh), is cached, and is never committed or uploaded; the
    # uploaded record holds labels and numbers only.
    name: embedding model x86_64 (${{ matrix.os }}, manual)
    if: github.event_name == 'workflow_dispatch' && !inputs.only_bundle
    runs-on: ${{ matrix.os }}
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep LF line endings (Windows)
        if: runner.os == 'Windows'
        run: |
          git config --global core.autocrlf false
          # llama.cpp (the borealis-embed git dependency) has paths longer than MAX_PATH.
          git config --global core.longpaths true
      - uses: actions/checkout@v4
      - name: Free runner disk (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Linux webkit2gtk deps and qemu-user
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev libxdo-dev qemu-user
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: embed-release
      - name: Drop a stale llama.cpp build
        run: bash build/ci/drop-stale-llama-build.sh target/release
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      # ui/dist: the Tauri crate (the app's speed-check test) needs it to compile.
      - run: npm ci && npm run build
        working-directory: ui
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/borealis-models
          key: embed-model-${{ hashFiles('crates/borealis-embed/src/models.rs') }}
      - name: Model (app sources, SHA-256 verified)
        run: |
          dir=$(cd "$RUNNER_TEMP" && pwd)/borealis-models
          model=$(bash build/fetch-embed-model.sh "$dir" | tail -n 1)
          if [ "$RUNNER_OS" = Windows ]; then model=$(cygpath -w "$model"); fi
          echo "BOREALIS_EMBED_MODEL=$model" >> "$GITHUB_ENV"
          mkdir -p embed-record
      - name: Build the release test binaries
        id: build
        run: |
          cargo test -p borealis-embed --features llama --release --test llama_reference --no-run \
            --message-format=json-render-diagnostics > embed-build.json
          exe=$(jq -r 'select(.reason == "compiler-artifact" and .target.name == "llama_reference" and .executable != null) | .executable' embed-build.json | tail -n 1)
          test -n "$exe"
          echo "REFERENCE_TEST=$exe" >> "$GITHUB_ENV"
          cargo test -p borealis --release --test semantic_real_model --no-run
          # B-49: the test binaries find llama.cpp's shared libraries here.
          out=$(dirname "$(ls -td target/release/build/llama-cpp-sys-2-*/out/backends | head -n 1)")
          if [ "$RUNNER_OS" = Linux ]; then echo "LD_LIBRARY_PATH=$out/lib" >> "$GITHUB_ENV"; fi
          # Windows: llama-cpp-sys-2 leaves the DLLs in out/bin (it does not copy them next to the binaries on MSVC).
          if [ "$RUNNER_OS" = Windows ]; then cygpath -w "$(cd "$out/bin" && pwd)" >> "$GITHUB_PATH"; fi
          echo "FAST_LEVELS=haswell|alderlake|skylakex|cannonlake|cascadelake|icelake|cooperlake|zen4|sapphirerapids" >> "$GITHUB_ENV"
      - name: llama.cpp x86 levels (Linux objdump)
        if: runner.os == 'Linux'
        run: bash build/check-x86-baseline.sh --require-modules target/release | tee embed-record/baseline.txt
      - name: llama.cpp x86 levels (Windows dumpbin)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./build/check-x86-baseline.ps1 target/release -RequireModules | Tee-Object -FilePath embed-record/baseline.txt
      - name: Cosine and speed record (S0.2 setup, 4 threads, context 2048)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          "$REFERENCE_TEST" --ignored --nocapture 2>&1 | tee embed-record/native-s02.log
          grep -h '^{"' embed-record/native-s02.log > embed-record/native-s02.json
          bash build/ci/backend-level.sh embed-record/native-s02.log embed-record native-s02 "$FAST_LEVELS"
      - name: Cosine and speed record (the app's desktop row on this runner, threads = cores / 2, cap 512)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          cores=$(nproc 2>/dev/null || echo "$NUMBER_OF_PROCESSORS")
          threads=$(( cores / 2 )); [ "$threads" -ge 1 ] || threads=1; [ "$threads" -le 4 ] || threads=4
          BOREALIS_EMBED_THREADS=$threads BOREALIS_EMBED_MAX_TOKENS=512 "$REFERENCE_TEST" --ignored --nocapture 2>&1 \
            | tee embed-record/native-app.log
          grep -h '^{"' embed-record/native-app.log > embed-record/native-app.json
          bash build/ci/backend-level.sh embed-record/native-app.log embed-record native-app "$FAST_LEVELS"
      - name: The app's speed check (hybrid or keyword-only on this runner)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          cargo test -p borealis --release --test semantic_real_model -- --ignored --nocapture 2>&1 | tee embed-record/app-check.log
          grep -h '^{"' embed-record/app-check.log > embed-record/app-check.json
          bash build/ci/backend-level.sh embed-record/app-check.log embed-record app-check "$FAST_LEVELS"
      # Negative control for both emulators: an AVX2 build of a tiny program must be stopped by them.
      - name: AVX probe program
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          probe=$(cd "$RUNNER_TEMP" && pwd)/avxprobe
          mkdir -p "$probe"
          printf '%s\n' 'fn main() {' \
            '    let n = std::env::args().count() as u32 * 100_000;' \
            '    let v: Vec<u32> = (0..n).collect();' \
            '    let s = std::hint::black_box(&v).iter().fold(0u32, |a, x| a.wrapping_add(x.wrapping_mul(3)));' \
            '    println!("{s}");' '}' > "$probe/main.rs"
          ext=""; if [ "$RUNNER_OS" = Windows ]; then ext=.exe; fi
          rustc -O -C target-cpu=haswell -o "$probe/avxprobe$ext" "$probe/main.rs"
          "$probe/avxprobe$ext"
          echo "AVX_PROBE=$probe/avxprobe$ext" >> "$GITHUB_ENV"
      - name: Old CPU (Linux, qemu-user -cpu Conroe)
        if: ${{ runner.os == 'Linux' && !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 180
        run: |
          echo "probe ymm instructions: $(objdump -d "$AVX_PROBE" | grep -c ymm)"
          if qemu-x86_64 -cpu Conroe "$AVX_PROBE"; then echo "::error::qemu -cpu Conroe ran AVX2 code"; exit 1; fi
          echo "negative control: qemu -cpu Conroe stops the AVX2 probe"
          qemu-x86_64 -cpu Haswell "$AVX_PROBE"
          BOREALIS_EMBED_THREADS=4 qemu-x86_64 -cpu Conroe "$REFERENCE_TEST" --ignored --nocapture 2>&1 | tee embed-record/conroe.log
          grep -h '^{"' embed-record/conroe.log > embed-record/conroe.json
          bash build/ci/backend-level.sh embed-record/conroe.log embed-record conroe x64
      - uses: petarpetrovt/setup-sde@6d2773bc0ef3005fd52e0ae0bb91782321793aec # v6.0
        if: ${{ runner.os == 'Windows' && !cancelled() }}
      - name: Old CPU (Windows, Intel SDE -mrm)
        if: ${{ runner.os == 'Windows' && !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 180
        run: |
          sde=$(find "$(cygpath -u "$SDE_PATH")" -name sde.exe | head -n 1)
          probe=$(cygpath -w "$AVX_PROBE")
          if "$sde" -mrm -- "$probe" > embed-record/sde-probe.log 2>&1; then
            cat embed-record/sde-probe.log; echo "::error::SDE -mrm ran AVX2 code"; exit 1
          fi
          grep -m 1 -E 'SDE-ERROR|not valid' embed-record/sde-probe.log || true
          echo "negative control: SDE -mrm stops the AVX2 probe"
          BOREALIS_EMBED_THREADS=4 "$sde" -mrm -- "$(cygpath -w "$REFERENCE_TEST")" --ignored --nocapture 2>&1 | tee embed-record/sde-mrm.log
          grep -h '^{"' embed-record/sde-mrm.log > embed-record/sde-mrm.json
          bash build/ci/backend-level.sh embed-record/sde-mrm.log embed-record sde-mrm x64
      - name: Record
        if: always()
        run: |
          {
            echo "### Embedding model on ${{ matrix.os }}"
            for f in embed-record/*.json; do
              if [ -f "$f" ]; then echo "- $(basename "$f"): \`$(cat "$f")\`"; fi
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: embed-record-${{ matrix.os }}
          path: embed-record/
