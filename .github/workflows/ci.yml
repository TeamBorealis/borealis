name: CI

# Cost-aware: push/PR run Linux + Windows only. macOS (10x minutes), iOS and Android run only when
# started by hand (Actions > CI > Run workflow).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Debug info makes the test binaries big enough to exhaust the runner disk (ld Bus error on ubuntu).
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  test:
    name: build+test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Keep LF line endings (Windows)
        # The AI profile is hash-verified and content files are byte-compared; CRLF breaks both.
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - name: Free runner disk (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Linux webkit2gtk deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev libxdo-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: test
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
        working-directory: ui
      - name: UI tests (platform independent, Linux only)
        if: runner.os == 'Linux'
        run: npm test
        working-directory: ui
      # Also produces ui/dist, which the Tauri crate needs to compile.
      - run: npm run build
        working-directory: ui
      # The e2e suite is TypeScript too: typecheck it next to the UI (no browser needed).
      - name: e2e typecheck (Linux only)
        if: runner.os == 'Linux'
        run: |
          npm ci
          npm run typecheck
        working-directory: e2e
      - name: rustfmt (Linux only)
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --no-fail-fast

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo audit
        # Warnings (the known unmaintained-crate advisories) do not fail the job; vulnerabilities do.
        run: |
          cargo install cargo-audit --locked
          cargo audit
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm audit --omit=dev --audit-level=high
        working-directory: ui

  desktop-bundle:
    name: desktop bundle (${{ matrix.os }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Release builds: the Windows debug exe is console-subsystem (a console window opens).
        # Linux: deb + AppImage (tauri.linux.conf.json); Windows: unsigned NSIS installer
        # (tauri.windows.conf.json).
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Keep LF line endings (Windows)
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - name: Free runner disk (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Linux webkit2gtk deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev libxdo-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: bundle
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
        working-directory: ui
      - uses: tauri-apps/tauri-action@v0
        with:
          projectPath: .
          # Through node: Windows cannot run the extension-less .bin/tauri shim by path.
          tauriScript: node ui/node_modules/@tauri-apps/cli/tauri.js
      - name: Linux launch smoke (Xvfb)
        # Launches the bundled binary headless: GUI stays up, main window maps, --mcp answers on stdio.
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y xvfb xauth dbus-x11 xdotool imagemagick
          BIN=$(ls target/*/bundle/deb/*/data/usr/bin/borealis | head -n 1)
          build/linux/smoke.sh "$BIN" linux-smoke ci
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux' && always()
        with:
          name: linux-smoke-screenshots
          path: linux-smoke/
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.os }}
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/rpm/*.rpm
          if-no-files-found: error

  macos:
    name: macOS build+test+bundle (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
        working-directory: ui
      - run: npm run build
        working-directory: ui
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - uses: tauri-apps/tauri-action@v0
        with:
          projectPath: .
          tauriScript: node ui/node_modules/@tauri-apps/cli/tauri.js
          args: --debug
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-macos-latest
          path: target/debug/bundle/dmg/*.dmg
          if-no-files-found: error

  ios:
    name: iOS build (manual, experimental)
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
        working-directory: ui
      - run: node ui/node_modules/@tauri-apps/cli/tauri.js ios init --ci
      - run: node ui/node_modules/@tauri-apps/cli/tauri.js ios build --debug --target aarch64-sim --ci

  android:
    name: Android build (manual, experimental)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Install NDK
        run: sdkmanager "ndk;27.0.12077973" "platforms;android-34" "build-tools;34.0.0"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
        working-directory: ui
      - name: Build
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973
          # llama.cpp (llama-cpp-sys-2) reads ANDROID_NDK, not NDK_HOME; without it it picks the newest NDK
          # under ANDROID_HOME, which need not be the one the Rust linker uses.
          ANDROID_NDK: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973
        run: |
          node ui/node_modules/@tauri-apps/cli/tauri.js android init --ci
          node ui/node_modules/@tauri-apps/cli/tauri.js android build --debug --apk --target aarch64 --ci
