name: Mac App Store build

# MAS1 (B-190, specs/mac-app-store.md): builds the Mac App Store flavour (cargo feature `mas` plus the
# tauri.mas.conf.json overlay) ad-hoc signed, with no Apple certificate and no secrets, and checks the bundle:
# sandbox entitlements, Info.plist keys, container-migration.plist, no AI CLI integration. It does not sign for the
# store, build a .pkg or upload anything (phase 2). Started by hand only (macOS minutes cost 10x).
on:
  workflow_dispatch:
    inputs:
      run_tests:
        description: "Also run the borealis crate tests with the mas feature"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: mas-build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  mas:
    name: Mac App Store flavour (unsigned)
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Xcode
        run: xcodebuild -version && sw_vers
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
        with:
          workspaces: ". -> target"
          shared-key: macos-mas
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
        working-directory: ui
      - name: Clippy (mas feature)
        run: cargo clippy -p borealis --all-targets --features mas -- -D warnings
      - name: Tests (mas feature)
        if: ${{ inputs.run_tests }}
        run: cargo test -p borealis --features mas --no-fail-fast
      # `-` signs ad-hoc: the entitlements are applied, so the sandbox is real when the app runs, but nothing is
      # signed by Apple. The store signing, productbuild and upload are phase 2 (specs/mac-app-store.md).
      - name: Build the app
        env:
          APPLE_SIGNING_IDENTITY: "-"
        run: >-
          node ui/node_modules/@tauri-apps/cli/tauri.js build --bundles app
          --config src-tauri/tauri.mas.conf.json --features mas
      - name: Check entitlements, Info.plist and bundle
        run: bash build/ci/mas-check.sh target/release/bundle/macos/Borealis.app
      - name: Pack the app
        run: ditto -c -k --keepParent target/release/bundle/macos/Borealis.app Borealis-mas-unsigned.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: borealis-mas-unsigned
          path: Borealis-mas-unsigned.zip
          retention-days: 7
