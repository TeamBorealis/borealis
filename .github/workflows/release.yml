name: Release

# Pushing a tag like v1.0.0 builds the Linux and Windows installers and attaches them, plus
# SHA256SUMS.txt, to a DRAFT GitHub release. The macOS .dmg is built locally and attached by hand
# before the draft is published. Asset names are Tauri's defaults and must stay stable: the
# website links to them.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  verify-version:
    name: verify tag matches tauri.conf.json
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      # Releases only ship commits that CI has already tested: the release itself builds but
      # does not run the test suite. Wait for CI to finish on main before pushing the tag.
      - name: require a successful CI run on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          passed=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$SHA&status=success" --jq '.total_count')
          if [ "$passed" -lt 1 ]; then
            echo "::error::no successful CI run for $SHA; push it to main, wait for CI to pass, then tag it"
            exit 1
          fi
          echo "CI passed for $SHA"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - id: v
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          conf_version=$(jq -r .version src-tauri/tauri.conf.json)
          if [ "$REF_TYPE" = "tag" ]; then
            if [ "$REF_NAME" != "v$conf_version" ]; then
              echo "::error::tag $REF_NAME does not match tauri.conf.json version $conf_version (expected v$conf_version)"
              exit 1
            fi
          fi
          echo "version=$conf_version" >> "$GITHUB_OUTPUT"
          echo "tag=v$conf_version" >> "$GITHUB_OUTPUT"

  build:
    name: bundle (${{ matrix.os }})
    needs: verify-version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        # Linux x86_64: deb + rpm + AppImage (targets "all"); Windows x64: NSIS only
        # (tauri.windows.conf.json). No macOS, iOS or Android here.
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Keep LF line endings (Windows)
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Free runner disk (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Linux webkit2gtk deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev libxdo-dev
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
        with:
          workspaces: ". -> target"
          shared-key: bundle
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
        working-directory: ui
      - uses: tauri-apps/tauri-action@564aea5a8075c7a54c167bb0cf5b3255314a7f9d # action-v0.5.22
        with:
          projectPath: .
          # Through node: Windows cannot run the extension-less .bin/tauri shim by path.
          tauriScript: node ui/node_modules/@tauri-apps/cli/tauri.js
      - name: Collect installers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-release
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp target/release/bundle/nsis/*.exe dist-release/
          else
            cp target/release/bundle/deb/*.deb target/release/bundle/rpm/*.rpm \
               target/release/bundle/appimage/*.AppImage dist-release/
          fi
          ls -l dist-release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: installers-${{ matrix.os }}
          path: dist-release/*
          if-no-files-found: error

  publish-draft:
    name: draft release
    needs: [verify-version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.verify-version.outputs.version }}
      TAG: ${{ needs.verify-version.outputs.tag }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: assets
          pattern: installers-*
          merge-multiple: true
      - name: Check expected asset names
        working-directory: assets
        run: |
          set -euo pipefail
          for f in \
            "Borealis_${VERSION}_amd64.deb" \
            "Borealis_${VERSION}_amd64.AppImage" \
            "Borealis-${VERSION}-1.x86_64.rpm" \
            "Borealis_${VERSION}_x64-setup.exe"; do
            [ -f "$f" ] || { echo "::error::missing expected asset $f"; ls -l; exit 1; }
          done
      - name: Checksums
        working-directory: assets
        run: |
          set -euo pipefail
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Create or update the draft release
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --title "Borealis $VERSION" \
              --notes "Borealis $VERSION. Verify downloads against SHA256SUMS.txt." \
              --target "$GITHUB_SHA"
          fi
          gh release upload "$TAG" assets/* --clobber
