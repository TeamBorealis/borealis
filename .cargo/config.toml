# Build environment for the C/C++ code compiled by build scripts (llama.cpp through llama-cpp-sys-2, B-12).
# `[env]` does not override a variable that is already set, so Xcode (IPHONEOS_DEPLOYMENT_TARGET from the project)
# and the Tauri CLI (MACOSX_DEPLOYMENT_TARGET from bundle.macOS.minimumSystemVersion) still win; these values are
# the same, for plain `cargo` builds and checks.
[env]
# iOS: the app's deploymentTarget. Without it cmake compiles llama.cpp for the SDK version while rustc links for
# an older one, and the device link fails (`___chkstk_darwin`, spike S0.2 sec. 6).
IPHONEOS_DEPLOYMENT_TARGET = "15.0"
# macOS: tauri.macos.conf.json minimumSystemVersion. Unset, llama.cpp is compiled for the build machine's macOS;
# below 10.15 it does not compile (std::filesystem).
MACOSX_DEPLOYMENT_TARGET = "10.15"
# Android: minSdk (gen/android/app/build.gradle.kts). llama-cpp-sys-2 would otherwise compile for API 28.
ANDROID_API_LEVEL = "24"
# x86_64 (S3.3): ggml turns SSE4.2, AVX, AVX2, BMI2, FMA and F16C ON by default whenever GGML_NATIVE is OFF on a
# native (not cross) build, and llama-cpp-sys-2 sets GGML_NATIVE=OFF. A Windows / Linux x86_64 build would then
# carry /arch:AVX2 (-mavx2 -mfma -mf16c -mbmi2) code and crash with an illegal instruction on CPUs without AVX2.
# Off here, so x86_64 builds use the SSE2 baseline every x86_64 CPU has; llama-cpp-sys-2 still turns an option back
# on when Rust's target features include it (an explicit `-C target-feature=+avx2` build). Ignored on ARM.
# `build/check-x86-baseline.sh` verifies the built libraries. CMake caches from before this need
# `cargo clean -p llama-cpp-sys-2` once (cmake does not reconfigure an existing build).
# x86_64 Linux (B-49) builds llama.cpp as shared libraries. Unversioned names (libllama.so, SONAME libllama.so, no
# libllama.so.0 symlink chain): llama-cpp-sys-2 hard-links each library into the target folder and, given a symlink,
# links the symlink itself, which dangles there and makes the next build of the crate fail ("File exists").
# Static builds (every other target) have no SONAME, so this changes nothing there.
CMAKE_PLATFORM_NO_VERSIONED_SONAME = "ON"
# Windows MSVC (B-56): llama.cpp's DLLs and CPU backend modules link the C++ library and vcruntime statically and the
# Universal CRT dynamically, like borealis.exe, so none of them imports msvcp140.dll / vcruntime140*.dll and the app
# starts without the Visual C++ redistributable. LLAMA_STATIC_CRT makes llama-cpp-sys-2 compile with /MT; the CMake
# include (run after llama.cpp's project()) sets the matching runtime and the dynamic UCRT, and says why not fully
# static. Both are ignored by every other compiler. `build/check-no-vc-runtime.ps1` checks the built and installed
# files. A CMake cache from before this needs `cargo clean -p llama-cpp-sys-2` once (build/ci/drop-stale-llama-build.sh).
LLAMA_STATIC_CRT = "1"
CMAKE_PROJECT_INCLUDE = { value = "build/msvc-hybrid-crt.cmake", relative = true }
GGML_SSE42 = "OFF"
GGML_AVX = "OFF"
GGML_AVX2 = "OFF"
GGML_BMI2 = "OFF"
GGML_FMA = "OFF"
GGML_F16C = "OFF"
